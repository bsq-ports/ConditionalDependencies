name: NDK build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['master', 'dev/*', 'feat/*', 'fix/*']
  pull_request:
    branches: master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v3
      - uses: Fernthedev/qpm-action@v2
        with:
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && 'late' || '' }}
          publish_token: ${{ secrets.QPM_TOKEN }}
      - name: Build and package
        run: qpm2 qpkg
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-dependencies
          path: |
            conditional-dependencies.qpkg
            build/libconditional-dependencies-test-1.so
            build/libconditional-dependencies-test-2.so
          if-no-files-found: error
